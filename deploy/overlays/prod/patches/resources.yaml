# Autopilot bursting. Requests are what Autopilot bills; limits above requests
# are honoured on clusters >= 1.29.3-gke.1093000 and let a pod consume unused
# node capacity for free. The old "Autopilot forces limits == requests" rule no
# longer applies, and the per-pod floor is now 50m / 52Mi rather than
# 0.25 vCPU / 0.5 GiB.
#
# Memory limit always equals memory request, on purpose. CPU over-limit is
# throttled, a slowdown, but memory over-limit is an OOM kill, so "bursting"
# memory buys a crash instead of headroom.
#
# THE CPU CEILING IS BOUNDED BY THE MEMORY REQUEST, not chosen freely. Autopilot's
# general-purpose compute class requires a memory:CPU ratio between 1:1 and 6.5:1
# (GiB per vCPU), and for a burstable pod that constraint applies to the *limits*
# as well as the requests. The limits are what the pod may actually consume. A
# limit pair outside the range is not rejected; Autopilot silently rewrites the
# pod's resources to bring it back in range, which is the "resource adjustment"
# note that shows up on the workload in the console, and it can push the pod into
# a scale-up it did not ask for.
#
# Since memory limit == memory request here (above), the rule reduces to:
#
#     cpu limit <= memory request in GiB
#
# 512Mi of memory therefore caps the CPU limit at 500m, NOT 1. Three workloads
# (migrate, commerce, admin) were pinned at cpu limit "1" against 512Mi, a 0.5:1
# ratio, under the 1:1 floor, and were being adjusted on every deploy. Raising
# memory instead of lowering CPU also works, but it raises the billed request:
# requests are what Autopilot charges for, and none of the three needs the RAM.
#
# YOUR EDITOR WILL FLAG "spec.selector is required" ON THE FOUR DEPLOYMENTS
# BELOW. False positive, and the field must NOT be added. Same as in
# patches/secrets-scoped.yaml, whose header has the long version. These are
# strategic merge patches, not manifests: they carry only the fields being
# overridden, and the selector comes from base. spec.selector is IMMUTABLE on a
# live Deployment, so duplicating it here turns any later divergence from base
# into a hard apply failure. Only the Deployments are flagged (4, not 10)
# because spec.selector is required on Deployment in the Kubernetes schema and
# optional on Job and CronJob.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: builder
spec:
  template:
    spec:
      containers:
        - name: builder
          resources:
            requests:
              cpu: "250m"
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 1Gi
---
# The worker's CPU request stays low for the same reason builder's does, turns
# are blocked on OpenRouter, not computing. It runs up to PUBSUB_MAX_CONCURRENCY
# turns at once, each holding a DSPy state and its candidate set. Memory request
# equals limit here as everywhere: over-limit memory is an OOM kill, and an
# OOM-killed worker drops every turn it was running.
#
# 1Gi, DOWN FROM 2Gi, from a measurement (DSPy 3.5, no litellm): the real
# worker code running 8 concurrent load-test turns against the seeded catalog
# holds ~200 MB after warm-up and ~220 MB at peak, and stays flat near 260 MB
# over 2,400 turns. Flat only because configure_dspy caps DSPy's call
# histories and trace (DSPY_HISTORY_CAP); at DSPy's defaults the same worker
# grew ~130 KB per turn for thousands of turns, which is what 2Gi had been
# quietly absorbing. Under litellm the baseline was ~120 MB higher.
#
# The CPU limit drops from 2 to 1 with it, by the ratio rule above. That costs
# nothing measurable: start-up (imports, configure_dspy, the Decide* weights)
# uses 0.9 of one core, and a Python process is single-core bound by the GIL
# for this work anyway.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  template:
    spec:
      containers:
        - name: worker
          resources:
            requests:
              cpu: "250m"
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: commerce
spec:
  template:
    spec:
      containers:
        - name: commerce
          resources:
            requests:
              cpu: "250m"
              memory: 512Mi
            limits:
              # 500m, not 1: 512Mi caps the ratio-legal CPU limit at half a vCPU.
              cpu: "500m"
              memory: 512Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin
spec:
  template:
    spec:
      containers:
        - name: admin
          resources:
            requests:
              cpu: "250m"
              memory: 512Mi
            limits:
              # 500m, not 1: 512Mi caps the ratio-legal CPU limit at half a vCPU.
              cpu: "500m"
              memory: 512Mi
---
# Jobs are billed the same way as Deployments on Autopilot, so they get the same
# treatment. Migrations are short and bursty. A low request keeps the billed
# baseline small while the CPU ceiling keeps `alembic upgrade head` from
# crawling.
#
# This one matters more than the others: migrate gates the rollout, so an
# Autopilot resource rewrite here does not just cost a little scheduling latency,
# it stalls `kubectl wait` in the migrate step of deploy/cloudbuild.yaml, which
# reports as "timed out waiting for the condition" with no migration logs,
# because the container never started.
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
spec:
  template:
    spec:
      containers:
        - name: alembic
          resources:
            requests:
              cpu: "250m"
              memory: 512Mi
            limits:
              # 500m, not 1: 512Mi caps the ratio-legal CPU limit at half a vCPU.
              cpu: "500m"
              memory: 512Mi
---
# The ETL and discovery jobs are network-latency bound (SerpApi, HTTP fetch, LLM
# extraction), so they spend most of their wall time idle. A high CPU request
# would be billed for the entire run to no benefit; the burst ceiling covers the
# parsing spikes.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pricing-etl
spec:
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: etl
              resources:
                requests:
                  cpu: "500m"
                  memory: 2Gi
                limits:
                  cpu: "2"
                  memory: 2Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: discovery
spec:
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: discovery
              resources:
                requests:
                  cpu: "500m"
                  memory: 2Gi
                limits:
                  cpu: "2"
                  memory: 2Gi
