apiVersion: batch/v1
kind: CronJob
metadata:
  name: embeddings
spec:
  # SUSPENDED: run by hand, never on a schedule. Vectors serve exactly one
  # purpose, resolving names (games, software, AI models, parts) that the exact
  # name/alias tier misses, and a name's vector does not go stale on its own.
  # Generate once, then again only after a catalog import or a batch of admin
  # edits:
  #
  #   kubectl create job --from=cronjob/embeddings embed-once
  #
  # The sweep is content-addressed, so a manual run embeds only rows that are
  # new or whose text changed, and costs nothing when nothing did.
  #
  # Until that run, a newly added row is reachable by exact name or alias only.
  # Kept as a CronJob rather than a bare Job so `create job --from` has a
  # template to copy; `kubectl apply` writes suspend onto the existing object,
  # which is what stops it in prod (the deploy step does not prune).
  suspend: true
  # Required by the CronJob schema and inert while suspended. 04:30 keeps it
  # clear of pricing-etl at 04:00 if it is ever unsuspended.
  schedule: "30 4 * * *"
  timeZone: "America/Los_Angeles"
  # Two concurrent sweeps would race on the same (entity_type, entity_id) rows
  # and pay twice for identical vectors. The upsert makes that safe, not cheap.
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # 1 retry, unlike discovery's 0: a failed row is simply left un-upserted,
      # so the retry re-embeds only what did not land rather than re-paying for
      # the whole sweep. The common failure here is a transient 429, which a
      # retry actually fixes.
      backoffLimit: 1
      # Generous for the steady state (a handful of changed rows), and sized so
      # a first full backfill of the catalog still completes inside it. Batches
      # run sequentially by design. See services/embeddings/client.py.
      activeDeadlineSeconds: 3600
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          restartPolicy: Never
          serviceAccountName: builder
          containers:
            - name: embeddings
              image: palladium/builder
              command: ["python", "-m", "app.jobs.embeddings"]
              envFrom:
                - configMapRef:
                    name: builder-config
                - secretRef:
                    name: palladium-secrets
              # Network-latency bound, like discovery: it holds one batch of
              # 128 texts and their returned vectors in memory at a time, and
              # spends the rest of its life waiting on HTTP.
              resources:
                requests:
                  cpu: "250m"
                  memory: 512Mi
                limits:
                  cpu: "500m"
                  memory: 1Gi
# REQUIRES OPENAI_API_KEY in the referenced secret. Without it the job exits 1
# by design rather than no-oping, so an unconfigured key shows up as a red
# CronJob instead of a silently empty embeddings table, which is the failure
# mode that is otherwise invisible, since every read path degrades to "no
# matches" without erroring.
